<button
  class="button"
  [class.button--secondary]="variant() === 'secondary'"
  [class.button--soft]="variant() === 'soft'"
  [class.button--full-width]="fullWidth()"
  [class.button--pill]="pill()"
  [class.button--field]="size() === 'field'"
  [disabled]="disabled()"
  [type]="type()"
>
  <ng-content />
</button>
